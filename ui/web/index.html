<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<!-- Ícone embutido: sem isto o navegador pede /favicon.ico e leva 404 em todo
     carregamento, poluindo o log do servidor com ruído que não é problema. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2300e5ff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2300e5ff'/%3E%3C/svg%3E">
<!-- Nada externo: a interface precisa abrir com a internet caída, igual ao
     resto do James. Three.js está em vendor/, e as fontes caem para as do
     sistema quando Space Grotesk / JetBrains Mono não estiverem instaladas. -->
<style>
:root{
  --bg:#020406; --bg2:#071016; --tech:#6f7b83; --soft:#d8f8ff;
  --acc:#00e5ff; --acc3:#7cf6ff;
  --line:rgba(0,229,255,.26); --line2:rgba(0,229,255,.10);
  --pan:rgba(5,12,16,.58); --glow:0 0 12px rgba(0,229,255,.30);
  --tint:rgba(0,229,255,.12); --tint2:rgba(0,229,255,.09); --tint3:rgba(0,229,255,.16); --barbg:rgba(7,16,22,.92);
  --sans:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
}
[data-mode="ultron"]{
  --bg:#040201; --bg2:#140a04; --tech:#9c7c50; --soft:#fff4d0;
  --acc:#ff8a00; --acc3:#ffc247;
  --line:rgba(255,138,0,.34); --line2:rgba(255,138,0,.14);
  --pan:rgba(16,8,2,.58); --glow:0 0 16px rgba(255,138,0,.42);
  --tint:rgba(255,138,0,.14); --tint2:rgba(255,138,0,.10); --tint3:rgba(255,138,0,.18); --barbg:rgba(18,9,4,.92);
}
html,body{margin:0;padding:0;background:#020406;overflow:hidden}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer;background:transparent;border:none;color:inherit}
input{font-family:inherit}
input::placeholder{color:var(--tech)}
::-webkit-scrollbar{width:0;height:0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes pulseSoft{0%,100%{opacity:.18}50%{opacity:.5}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.18}}
@keyframes drawX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drawY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes riseIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes sweep{0%{transform:translateY(-10%);opacity:0}12%{opacity:.7}100%{transform:translateY(1100%);opacity:0}}
@keyframes bootOut{0%,72%{opacity:1}100%{opacity:0;visibility:hidden}}
@media (max-width:1340px){ [data-narrow-hide]{display:none} }
@media (max-width:1080px){ [data-narrow-hide2]{display:none} }

#root{position:fixed;inset:0;background:var(--bg);color:var(--soft);
  font-family:var(--sans);overflow:hidden;user-select:none}
.layer{position:absolute;inset:0;pointer-events:none}
.hud{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;pointer-events:none}
.hud .bar,.hud .rail,.hud .ctx,.hud .cmd{pointer-events:auto}
.mono{font-family:var(--mono)}

/* barra superior */
.bar{display:flex;align-items:stretch;gap:18px;height:46px;
  border-bottom:1px solid var(--line2);padding:0 16px;
  background:linear-gradient(180deg,var(--barbg),transparent)}
.dot{width:9px;height:9px;background:var(--acc);box-shadow:var(--glow);
  animation:blink 2.4s ease-in-out infinite;flex:none}
.identity{font-size:13px;font-weight:600;letter-spacing:6px;color:var(--acc);
  text-shadow:var(--glow);white-space:nowrap}

/* corpo */
.body{flex:1;display:grid;grid-template-columns:86px 1fr clamp(230px,19vw,310px);min-height:0}
.rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;
  border-right:1px solid var(--line2);overflow-y:auto;scrollbar-width:none}
.rail button{width:70px;padding:4px 0;display:flex;flex-direction:column;align-items:center;
  gap:2px;color:var(--tech);border-left:1px solid transparent;transition:all .18s;flex:none}
.rail button:hover,.rail button.on{color:var(--acc)}
.rail button.on{background:var(--tint2)}
.rail button.open{border-left-color:var(--acc)}
.rail .ic{font-size:14px;line-height:1;transition:transform .18s}
.rail button:hover .ic{transform:scale(1.25);text-shadow:0 0 12px var(--acc)}
.rail .nm{font-family:var(--mono);font-size:7.5px;letter-spacing:.8px;line-height:1}

.center{position:relative;display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-width:0;min-height:0}
.ctx{border-left:1px solid var(--line2);padding:12px 14px;display:flex;
  flex-direction:column;gap:10px;overflow-y:auto;min-height:0}

/* barras de progresso */
.row .lbl{display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:10px;letter-spacing:1px}
.row .track{height:3px;background:rgba(255,255,255,.05)}
.row .fill{height:100%;background:var(--acc);box-shadow:0 0 9px var(--acc);transition:width .6s ease}
.tag{font-family:var(--mono);font-size:8.5px;letter-spacing:1px;color:var(--acc3);
  border:1px solid var(--line);padding:2px 5px}
.bullet{display:flex;gap:7px;align-items:baseline;font-family:var(--mono);
  font-size:10px;letter-spacing:.6px;color:var(--tech)}

/* comando */
.cmd{padding:8px 16px 12px;display:flex;flex-direction:column;align-items:center;gap:7px}
.entry{width:min(880px,100%);display:flex;align-items:center;gap:12px;
  border:1px solid var(--line);background:var(--pan);backdrop-filter:blur(4px);padding:9px 14px}
.entry input{flex:1;min-width:0;background:transparent;border:none;outline:none;
  color:var(--soft);font-family:var(--mono);font-size:13px;letter-spacing:1px}
.entry button{font-family:var(--mono);font-size:10px;letter-spacing:2px;
  border:1px solid var(--line);padding:5px 10px;color:var(--acc3)}
.entry button:hover{background:var(--tint3)}
.entry button.live{background:var(--acc);color:#02060a;border-color:var(--acc)}

/* janelas holográficas */
.win{position:absolute;background:var(--pan);border:1px solid var(--line);
  backdrop-filter:blur(5px);padding:10px 12px;pointer-events:auto;
  display:flex;flex-direction:column;box-shadow:0 0 30px rgba(0,0,0,.55)}
.win .corner{position:absolute;background:var(--acc)}
.win .head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  cursor:move;padding-bottom:7px;border-bottom:1px solid var(--line2)}
.win .stage{position:relative;height:150px;margin-top:9px;border:1px solid var(--line2);
  background:radial-gradient(60% 60% at 50% 50%,var(--tint2),transparent 70%);overflow:hidden}

/* estado da conexão com o James */
.link-off{color:#ff5f56 !important}

/* ---- núcleo: o emblema de anéis ----
   Em modo J.A.R.V.I.S. o rosto é este conjunto de anéis em CSS, e o núcleo
   volumétrico recua para uma esfera de dados atrás dele (é o que o comentário
   em core-scene.js chama de "the DOM ring emblem is the face"). A escolha é
   boa e barata: conic-gradient com máscara custa quase nada perto de mais
   geometria WebGL, e é o que dá a leitura de "reator" de frente. */
.corewrap{position:relative;width:min(52vh,46vw);aspect-ratio:1;display:grid;place-items:center}
.corewrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;pointer-events:auto;touch-action:none}
.emblem{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}
.emblem>i{position:absolute;border-radius:50%;display:block}
.ring{-webkit-mask:radial-gradient(closest-side,transparent var(--i),#000 var(--o),#000 var(--o2,99%),transparent 100%);
      mask:radial-gradient(closest-side,transparent var(--i),#000 var(--o),#000 var(--o2,99%),transparent 100%)}
.spin-slow{animation:spin 180s linear infinite;will-change:transform;contain:paint}
.spin-med{animation:spin 110s linear infinite;will-change:transform;contain:paint}
.spin-rev{animation:spinR 90s linear infinite;will-change:transform;contain:paint}
.spin-fast{animation:spin 26s linear infinite;will-change:transform;contain:paint}
.spin-inner{animation:spinR 44s linear infinite;will-change:transform;contain:paint}
.core-name{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px}
.core-name b{font-size:clamp(15px,3.9vh,40px);font-weight:600;letter-spacing:.07em;color:#f2feff;
  text-shadow:0 0 18px rgba(110,215,255,.85),0 0 42px rgba(40,150,210,.55);white-space:nowrap}
[data-mode="ultron"] .core-name b{color:#fff4d0;text-shadow:0 0 18px rgba(255,170,50,.85),0 0 42px rgba(210,110,20,.55)}
.core-name small{font-family:var(--mono);font-size:8px;letter-spacing:2.6px;color:rgba(160,225,250,.55);white-space:nowrap}
[data-mode="ultron"] .core-name small{color:rgba(255,200,120,.6)}
</style>
</head>
<body>
<div id="root" data-mode="jarvis">
  <div class="layer" style="background:radial-gradient(110% 90% at 50% 44%, var(--bg2) 0%, var(--bg) 62%)"></div>
  <div class="layer" style="background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:64px 64px"></div>
  <div class="layer" style="background:radial-gradient(34% 34% at 50% 48%, var(--tint) 0%, transparent 70%);animation:pulseSoft 9s ease-in-out infinite"></div>

  <div class="layer" style="z-index:4;background:repeating-linear-gradient(0deg,rgba(255,255,255,.030) 0 1px,transparent 1px 3px);opacity:.16"></div>
  <div class="layer" style="z-index:4;height:120px;bottom:auto;background:linear-gradient(180deg,transparent,var(--tint2),transparent);animation:sweep 11s linear infinite"></div>
  <div class="layer" style="z-index:4;background:radial-gradient(78% 70% at 50% 50%, transparent 42%, rgba(0,0,0,.78) 100%)"></div>

  <div class="hud" id="hud"></div>
  <div class="layer" id="windows" style="z-index:6"></div>

  <!-- abertura -->
  <div id="boot" style="position:absolute;inset:0;z-index:9;display:grid;place-items:center;
       background:var(--bg);animation:bootOut 2.4s ease .35s both;pointer-events:none">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <div style="font-size:12px;letter-spacing:14px;color:var(--acc);text-shadow:var(--glow)">J A R V I S</div>
      <div style="width:320px;height:1px;background:rgba(255,255,255,.08);overflow:hidden">
        <div style="height:100%;background:var(--acc);transform-origin:left;animation:drawX 2.1s ease both;box-shadow:var(--glow)"></div>
      </div>
      <div class="mono" style="font-size:9px;letter-spacing:3px;color:var(--tech)">MONTANDO NÚCLEO VOLUMÉTRICO · CALIBRANDO TELEMETRIA</div>
    </div>
  </div>
</div>

<!-- Import map: o GLTFLoader importa de 'three' por nome. Sem isto ele não
     resolve, e é o motivo de o projeto usar o build ESM em vez do UMD — uma
     cópia só do Three.js, sem shim reexportando globais. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>

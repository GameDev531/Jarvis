# James — configuração central.
# Regra do projeto: o que é permitido/arriscado é decidido AQUI (determinístico),
# nunca pelo julgamento do LLM. Ver james/permissions/guard.py.

persona:
  nome: James
  tratamento: senhor          # como o James se dirige a você
  idioma: pt-BR

wake_word:
  # "jarvis" é keyword pré-treinada do Porcupine (grátis, sem treino).
  # Para "james" de verdade: gere um .ppn no console da Picovoice e aponte
  # keyword_path para ele, ou treine um modelo openWakeWord (Fase 7).
  keyword: jarvis
  keyword_path: null
  sensitivity: 0.6
  access_key_env: PORCUPINE_ACCESS_KEY

audio:
  sample_rate: 16000          # exigido por webrtcvad + Porcupine + whisper.cpp
  channels: 1
  sample_width: 2             # PCM 16-bit
  frame_ms: 30                # webrtcvad aceita apenas 10, 20 ou 30
  input_device: null          # null = dispositivo padrão do Windows
  output_device: null
  vad:
    aggressiveness: 2         # 0 (permissivo) a 3 (agressivo)
    start_frames: 3           # frames de fala consecutivos para começar a gravar
    end_silence_ms: 700       # silêncio contínuo que encerra o comando
    preroll_ms: 300           # áudio mantido ANTES do início da fala (evita cortar sílaba)
    min_command_ms: 400       # abaixo disso é ruído, descarta
    max_command_ms: 15000     # teto duro de gravação
    max_wait_speech_ms: 6000  # se ninguém falar após o wake word, desiste

behavior:
  half_duplex: true           # pausa a escuta enquanto o TTS fala (evita eco — C3)
  barge_in: false             # true = wake word durante o TTS interrompe a fala
  tts_tail_ms: 300            # margem após o fim do áudio antes de reabrir o mic
  max_tool_iterations: 5      # teto duro de ciclos de tool por tarefa
  history_turns: 12           # turnos mantidos no histórico enviado ao LLM

llm:
  # Divisão de trabalho entre os modelos. A ordem é a preferência: se o
  # primeiro falhar ou estourar cota, o seguinte assume.
  #   perception = ouvir e transcrever  -> Gemini (aceita áudio)
  #   vision     = ver tela e câmera    -> Gemini (aceita imagem)
  #   reasoning  = decidir, escrever,   -> OpenRouter (modelos de texto maiores,
  #                chamar ferramentas      cota independente da do Gemini)
  roles:
    perception: [gemini]
    reasoning: [openrouter, gemini]
    vision: [gemini, openrouter]   # parte do catálogo :free enxerga imagem

  gemini:
    model: gemini-2.5-flash
    thinking_budget: 0        # desliga o "thinking" — latência menor no caminho de voz
    timeout_s: 30
    max_output_tokens: 800
    temperature: 0.7

  openrouter:
    # A cota diária do OpenRouter é POR CONTA e compartilhada entre TODOS os
    # modelos :free — 50/dia sem crédito, 1.000/dia com US$ 10 vitalícios,
    # 20/min sempre. A lista abaixo protege contra o 429 momentâneo de um
    # modelo; ela NÃO multiplica a cota diária.
    enabled: true
    timeout_s: 60
    cooldown_s: 60            # tempo que um modelo fica em resfriamento após 429
    temperature: 0.7
    max_output_tokens: 1200
    models:
      - meta-llama/llama-3.3-70b-instruct:free
      - qwen/qwen-2.5-72b-instruct:free
      - deepseek/deepseek-chat-v3-0324:free
      - google/gemma-2-9b-it:free
      - mistralai/mistral-7b-instruct:free
    # Modelos do catálogo :free que enxergam imagem. Mandar imagem para um
    # modelo de texto devolve erro ou, pior, uma alucinação sobre algo que ele
    # não viu — por isso a lista é separada.
    vision_models:
      - google/gemma-3-27b-it:free
      - google/gemma-3-12b-it:free
      - meta-llama/llama-3.2-11b-vision-instruct:free

  # Cotas separadas: os dois provedores têm limites independentes, e tratá-los
  # como um balde só desperdiçaria metade da capacidade diária.
  rate_limit:
    gemini:
      requests_per_minute: 10
      requests_per_day: 240
    openrouter:
      requests_per_minute: 15
      requests_per_day: 45    # suba para ~900 se comprar US$ 10 de crédito

  local_router:
    enabled: true             # casa comandos frequentes sem gastar requisição

tts:
  engine: piper
  # Baixe uma voz pt_BR em https://huggingface.co/rhasspy/piper-voices
  voice_path: voices/pt_BR-faber-medium.onnx
  binary: null                # ex: C:\piper\piper.exe — usado se o pacote Python falhar
  length_scale: 1.0           # >1 fala mais devagar
  sentence_streaming: true    # sintetiza e toca por sentença (reduz tempo até a 1ª palavra)

stt:
  # whisper.cpp — fallback offline e transcrição da confirmação de risco (sempre local)
  binary: null                # ex: C:\whisper\whisper-cli.exe
  model: models/ggml-tiny-q5_1.bin
  language: pt
  timeout_s: 60
  threads: 4

interface:
  enabled: true
  # window = janela comum do Python, com barra de título, que você move,
  #          minimiza e fecha como qualquer programa. É o padrão: não fica por
  #          cima de nada, não força composição de tela e não interfere no
  #          resto do sistema.
  # hud    = painel pequeno, sem borda, sempre no topo e transparente a
  #          cliques. Mais bonito, mas exige compositor e pesa mais.
  mode: window
  position: bottom-right      # só no modo hud
  size: 260                   # px do orbe (hud) / largura mínima (window)
  margin: 40
  fps: 30
  start_minimized: true       # a janela sobe minimizada e aparece ao ser chamado
  show_transcript: true       # mostra o que foi ouvido e o que foi respondido

killswitch:
  enabled: true
  hotkey: ctrl+alt+j          # cancela tudo e volta para IDLE

ipc:
  host: 127.0.0.1
  port: 47821
  heartbeat_s: 5
  heartbeat_timeout_s: 30
  restart_backoff_s: [2, 4, 8, 16, 30]

memory:
  # Memória curada em markdown. Você pode abrir e editar estes arquivos à mão.
  # Ela nasce só das conversas — o James não lê e-mail, arquivos nem histórico.
  dir: memories
  max_chars: 4000            # limite POR ARQUIVO; força guardar só o essencial

  # Camada 2: memória profunda em SQLite. Não entra no prompt sozinha — o James
  # consulta quando precisa, então aqui não há limite de caracteres.
  fatos_db: state/fatos.db
  max_fatos: 5000

skills:
  # Instruções especializadas por assunto, carregadas sob demanda.
  dir: skills
  # Instalar habilidade remota é baixar instruções de terceiros. Só destas
  # fontes, e sempre com confirmação.
  fontes_confiaveis:
    - anthropics/skills
    - vercel-labs/agent-skills

agentes:
  # Especialistas com catálogo reduzido. Um agente que enxerga cinco
  # ferramentas escolhe melhor que um generalista que enxerga trinta — e o
  # material bruto que ele acumula morre com ele, sem poluir a conversa.
  perfis:
    pesquisador:
      descricao: "Investiga assuntos na internet e sintetiza o que encontrou"
      ferramentas: [buscar_na_web, ler_pagina, pesquisa_aprofundada, registrar_fato]
    analista:
      descricao: "Analisa dados de mercado e monta planilhas"
      ferramentas: [analisar_acao, comparar_acoes, criar_planilha]
    arquivista:
      descricao: "Organiza arquivos e monta documentos"
      ferramentas: [listar_arquivos, organizar_arquivos, mover_arquivo, renomear_arquivo, criar_apresentacao, criar_planilha]

camera:
  device_index: 0            # 0 = webcam padrão

# ---------------------------------------------------------------------------
# MODOS — o que só liga quando você manda
# ---------------------------------------------------------------------------
# O James nasce fazendo o essencial: escuta a palavra de ativação, ouve, age e
# responde. Nada mais consome CPU ou câmera. Um modo é uma capacidade que ocupa
# recurso de forma contínua, e por isso fica desligada até você pedir:
#
#     "Jarvis, ativa a webcam"      -> liga o modo de gestos
#     "Jarvis, desativa a webcam"   -> fecha a câmera (a luz apaga)
#     "Jarvis, quais modos existem" -> lista o que há e o que está ligado
#
# Dois modos não podem disputar o mesmo recurso: se um já segura a câmera, o
# outro é recusado em vez de os dois brigarem pelo dispositivo.
modos:
  gestos:
    enabled: true
    # `false` aqui não desliga só o rastreamento: o modo nem é registrado, e
    # "ativa a webcam" responde que não existe esse modo.

    # Arquivo do modelo de mão do MediaPipe. Baixe uma vez:
    #   https://storage.googleapis.com/mediapipe-models/hand_landmarker/
    #       hand_landmarker/float16/1/hand_landmarker.task
    modelo: models/hand_landmarker.task

    # Quadros por segundo do rastreamento. 6 é suficiente para gestos de mão
    # (que duram quase um segundo) e é o que mantém o custo baixo enquanto o
    # modo está ligado. Subir isto é a forma mais rápida de travar a máquina.
    fps: 6

    # Quantos quadros seguidos com o mesmo gesto antes de ele valer. Menos que
    # 3 dispara com sombra e mão passando por acaso.
    estabilidade: 4

    # Segundos até o mesmo gesto poder disparar de novo.
    descanso_s: 1.5

    # Desliga sozinho depois deste tempo sem nenhum gesto. É a defesa contra o
    # caso mais provável: ligar, esquecer, e a câmera ficar aberta a tarde
    # inteira. 0 desativa o desligamento automático (não recomendado).
    timeout_min: 10

    # Gesto -> ação. As ações possíveis são fechadas e todas reversíveis num
    # segundo: parar, pausar_escuta, volume_mais, volume_menos, mudo,
    # desligar_modo. Um gesto NUNCA executa ação de Nível 2 — confirmar exige
    # saber quem está pedindo, e uma mão na câmera não identifica ninguém.
    # Deixe vazio ("") para um gesto não fazer nada.
    mapeamento:
      punho: parar
      palma_aberta: pausar_escuta
      polegar_cima: volume_mais
      polegar_baixo: volume_menos
      v: mudo
      apontar: ""

  holograma:
    enabled: true
    # A interface volumétrica (Three.js) roda no NAVEGADOR, em outro processo.
    # É de propósito: o bloom aditivo é carga contínua de GPU, e dentro do
    # processo do James ela disputaria CPU com o pipeline de voz — que é a
    # única coisa que não pode engasgar. No navegador, se travar você fecha a
    # aba e o James nem percebe.
    #
    #   "Jarvis, ativa o holograma"     abre a interface
    #   "Jarvis, desativa o holograma"  derruba o servidor
    #
    # A janela Qt comum continua sendo o padrão — funciona em qualquer máquina.
    dir: ui/web
    porta: 0                 # 0 = o sistema escolhe uma porta livre
    abrir_navegador: true    # false = o James só diz a URL, você abre quando quiser

office:
  # Onde salvar apresentações e planilhas. Precisa estar em permissions.folders.
  # Vazio = usa a primeira pasta permitida.
  output_dir: null

briefing:
  cidade: "Sao Paulo"        # clima via wttr.in (grátis, sem chave)

permissions:
  # Capturar a tela ou tirar foto pela webcam envia a imagem para análise na
  # nuvem. A tela pode ter senha, banco, conversa privada; a câmera é a sua
  # imagem. Por isso o padrão é perguntar antes, toda vez.
  # ATENÇÃO: deixar em `true` exige whisper.cpp instalado — sem confirmação por
  # voz, essas ações são recusadas.
  vision_requires_confirmation: true

  # Modos cuja ATIVAÇÃO exige confirmação. Desativar nunca é bloqueado: se
  # fechar a câmera dependesse de uma confirmação que pode falhar, ela ficaria
  # aberta contra a vontade de quem pediu para fechá-la.
  modos_sensiveis: [gestos]

  # --------- Nível 1: executa direto ---------
  # Apps permitidos. Chave = como você fala; valor = comando/executável.
  apps:
    chrome: "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"
    bloco de notas: "notepad.exe"
    notepad: "notepad.exe"
    calculadora: "calc.exe"
    explorador: "explorer.exe"
    spotify: "spotify.exe"
    vscode: "code"
    code: "code"

  # Pastas que tools de arquivo podem tocar (Fase 6). Fora daqui = bloqueado.
  folders:
    - "C:\\Users\\Public\\Downloads"

  # --------- Nível 2: exige confirmação verbal ---------
  # Casado contra a URL inteira, minúscula, sem acento.
  risky_url_patterns:
    - checkout
    - payment
    - pagamento
    - carrinho
    - "/cart"
    - cartao
    - boleto
    - pix
    - transferencia
    - bank
    - banco

  require_https: true         # http:// vira Nível 2 com aviso explícito

  # --------- Bloqueio duro: nunca executa ---------
  blocked_domains:
    - localhost
    - 127.0.0.1
    - 0.0.0.0
    - "169.254.169.254"       # metadata de nuvem
  blocked_url_schemes:
    - file
    - javascript
    - data
    - vbscript
    - about
    - chrome
    - ftp

  confirm:
    # auto    = por voz quando o whisper.cpp existe, por janela quando não
    # voz     = sempre por voz (se o STT faltar, a janela assume mesmo assim)
    # dialogo = sempre por janela — mais privado, não avisa a sala inteira
    # Com PIN configurado (python set_pin.py), é sempre por janela.
    mode: auto
    timeout_s: 10             # sem resposta = negado
    max_attempts: 2           # resposta ambígua = mais uma chance, depois a janela
    # Casamento determinístico — nunca passa pelo LLM (C2)
    yes_words: [sim, confirmo, confirmado, pode, pode sim, positivo, isso, claro, autorizo, prossiga, manda, ok, okay]
    no_words: [nao, não, negativo, cancela, cancelar, para, pare, esquece, aborta, abortar, deixa, melhor nao, melhor não]

security:
  # Higiene de conteúdo externo antes de entrar no histórico do LLM (A3)
  max_external_chars: 4000
  external_tag: resultado_externo

logs:
  dir: logs
  level: INFO
  audit_file: logs/audit.jsonl
  max_bytes: 5242880
  backup_count: 3

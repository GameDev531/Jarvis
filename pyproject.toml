[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "james-assistant"
version = "0.2.0"
description = "James — assistente de voz local estilo Jarvis para Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "sounddevice>=0.4.6",
    "google-genai>=1.0",
    "PySide6>=6.6",
    "webrtcvad-wheels>=2.0.14; sys_platform == 'win32'",
    "webrtcvad>=2.0.10; sys_platform != 'win32'",
]

[project.optional-dependencies]
# Piper como pacote Python. Se não instalar (ou travar nesta CPU), o projeto
# usa o binário piper.exe via subprocess — ver config.yaml -> tts.binary
piper = ["piper-tts>=1.2"]
# Apresentações e planilhas
office = ["python-pptx>=0.6.23", "openpyxl>=3.1"]
# Análise de câmera
camera = ["opencv-python>=4.9"]
# Palavra de ativação sem conta nem chave — o console da Picovoice recusa
# e-mail pessoal, então este é o caminho que funciona para todo mundo.
wakeword = ["openwakeword>=0.6", "onnxruntime>=1.16"]
# O Porcupine continua suportado para quem já tem chave.
porcupine = ["pvporcupine>=3.0"]
# Controle do navegador (modo Ultron): abrir abas, preencher formulários,
# inspecionar páginas. Prefira ANEXAR ao Chrome que você já tem — nesse caso
# `python -m playwright install` nem é preciso, e economiza ~150 MB.
navegador = ["playwright>=1.40"]
# Modo de gestos. Só é usado enquanto o modo está ligado — sem estes pacotes o
# resto do James funciona igual, e ligar o modo devolve uma frase explicando.
gestures = ["opencv-python>=4.9", "mediapipe>=0.10.14"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "openwakeword>=0.6", "onnxruntime>=1.16", "playwright>=1.40"]

[project.scripts]
james = "james.runtime.wake_listener:main"
james-orchestrator = "james.runtime.orchestrator:main"
james-check = "james.diagnostics.check_hardware:main"

[tool.hatch.build.targets.wheel]
packages = ["james"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# Marcador com nome errado vira erro, não silêncio: um `@pytest.mark.netwrok`
# desligaria a proteção de rede sem ninguém perceber.
addopts = "--strict-markers"
markers = [
    "network: precisa de internet de verdade (DNS, HTTP para fora)",
    "browser: precisa de um Chromium instalado (playwright install chromium)",
    "integration: fala com um serviço externo (Home Assistant, provedor de LLM)",
    "e2e: sobe o James inteiro, de ponta a ponta",
    "slow: leva mais de alguns segundos",
]
